rules:
  - id: no-inner-html
    patterns:
      - pattern-either:
          - pattern: $X.innerHTML = $Y
          - pattern: $X.outerHTML = $Y
          - pattern: $X.insertAdjacentHTML(...)
          - pattern: document.write(...)
    message: Untrusted text must render via textContent, never as HTML.
    severity: ERROR
    languages: [typescript, javascript]
  - id: no-eval
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)
    message: eval and new Function are forbidden.
    severity: ERROR
    languages: [typescript, javascript]
  - id: no-runtime-network
    pattern-either:
      - pattern: fetch(...)
      - pattern: new WebSocket(...)
      - pattern: new XMLHttpRequest(...)
      - pattern: navigator.sendBeacon(...)
    paths:
      include:
        - "**/web/src/**"
    message: Local runtime must not make network connections.
    severity: ERROR
    languages: [typescript, javascript]
